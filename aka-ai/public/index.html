
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKA AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <h1>AKA AI</h1>
    <p>Your personal AI assistant</p>

    <div id="messages"></div>

    <form id="chatForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Ask AKA anything..."
        required
      >
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
